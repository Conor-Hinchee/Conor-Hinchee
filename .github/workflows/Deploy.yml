name: Build and Deploy
on:
  push:
    branches: ["2026"]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies 😰
        run: npm install

      - name: Build 🔨
        run: npm run build

      # Firebase Hosting is now the live target for www.conorhinchee.com.
      - name: Deploy to Firebase Hosting 🔥
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.GCP_PROJECT_ID }}

      # Kept deliberately as a warm rollback target: GitHub Pages stays
      # up to date, so reverting is a DNS change and nothing else.
      # Delete this step once the Firebase cutover has settled.
      - name: Deploy to GitHub Pages (rollback target) 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
