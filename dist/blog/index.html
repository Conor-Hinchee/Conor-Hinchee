    <script>
      const initMarkdown = async () => {
        const t = localStorage.getItem("theme") || "light",
          e = document.getElementById("blog-post"),
          o = document.querySelector("#breadcrumbBlogDropdown ul"),
          n = document.querySelector("#breadcrumb-Nav-blog button span.mr-2");
        try {
          const r = await fetch("/blog/content/posts.json");
          if (!r.ok) throw new Error("Failed to fetch posts data");
          let l = (await r.json()).posts || [];
          l.sort((t, e) => new Date(e.date) - new Date(t.date));
          let a,
            s,
            i = new URLSearchParams(window.location.search).get("post");
          if (
            (i && "latest" !== i && (a = l.find((t) => t.id === i)),
            (a && "latest" !== i && i) || (l.length > 0 && (a = l[0])),
            a
              ? (s = a.id)
              : ((a = {
                  id: "2025-resolution",
                  title: "Default Post",
                  date: new Date().toISOString(),
                }),
                (s = "2025-resolution")),
            a &&
              a.title &&
              (document.title = `Conor Hinchee | Blog | ${a.title}`),
            o)
          )
            if (((o.innerHTML = ""), l.length > 0))
              l.forEach((t) => {
                const e = document.createElement("li"),
                  n = document.createElement("a");
                (n.href = `/blog/?post=${t.id}`),
                  (n.className =
                    "block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"),
                  (n.textContent = t.title),
                  e.appendChild(n),
                  o.appendChild(e);
              });
            else {
              const t = document.createElement("li");
              (t.innerHTML =
                '<span class="block px-4 py-2 text-gray-400">No posts available</span>'),
                o.appendChild(t);
            }
          n && a && a.title
            ? (n.textContent = `Post: ${a.title}`)
            : n && (n.textContent = "Post: N/A"),
            e &&
              (e.innerHTML = `\n            <zero-md src="/blog/content/${s}.md">\n              <template>\n                <link id="markdown-theme" rel="stylesheet" href="/blog/github-markdown-${t}.css" />\n              </template>\n            </zero-md>\n          `);
        } catch (r) {
          console.error("Error loading blog post:", r),
            e &&
              (e.innerHTML = `\n            <p class="text-red-500 dark:text-red-400">Error loading post. Displaying default content.</p>\n            <zero-md src="/blog/content/2025-resolution.md">\n              <template>\n                <link id="markdown-theme" rel="stylesheet" href="/blog/github-markdown-${t}.css" />\n              </template>\n            </zero-md>\n          `),
            n && (n.textContent = "Post: Error"),
            o &&
              (o.innerHTML =
                '<li><a href="/blog/" class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white">Blog Home (Error)</a></li>');
        }
      };
