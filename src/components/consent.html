<section
  id="consentBanner"
  class="font-mono bg-white dark:bg-black dark:text-white rounded-md border-black dark:border-white border-t-4 border-l-4 border-r-4 flex h-14 opacity-0 fixed left-0 bottom-0 right-0 items-center cursor-pointer transition-all delay-1000 z-50"
  style="
    transition-property: opacity, height, background-color, color, border-color;
    transition-duration: 0.3s;
  "
>
  <h4
    class="text-center w-full underline underline-offset-2 transition-all"
    id="consentTitle"
  >
    Cookie Consent
  </h4>
  <div
    class="hidden opacity-0 w-full overflow-hidden transition-all"
    id="consentContent"
  >
    <p class="text-center">
      I use 🍪's for tracking and stuff (to be clear its the digital kind, not
      the chocolate chip kind).
    </p>
    <div class="flex justify-around m-6">
      <button
        id="cookieConsent"
        class="underline underline-offset-2 hover:decoration-2"
      >
        I CONSENT TO 🍪
      </button>
      <button
        id="cookieDecline"
        class="underline underline-offset-2 hover:decoration-2"
      >
        I DECLINE 🚫
      </button>
    </div>
  </div>
</section>
