<script>
  // Keep a list of callbacks waiting for consent changes
  const consentListeners = [];

  // GTM template will call this to subscribe
  window.addConsentListenerExample = (callback) => {
    consentListeners.push(callback);
  };

  // Your banner calls this when user updates consent
  window.onConsentChange = (consent) => {
    consentListeners.forEach((cb) => cb(consent));
  };
</script>
