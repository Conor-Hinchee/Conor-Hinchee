<div
  id="falling-stars-container"
  class="w-full h-64 md:h-96 relative overflow-hidden rounded-lg bg-gray-900"
>
  <canvas
    id="asteroids-canvas"
    class="absolute top-0 left-0 w-full h-full"
  ></canvas>
  <div class="absolute top-4 left-4 text-white font-mono text-sm">
    <span id="score">SCORE: 0</span>
  </div>
</div>

<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.module.js";

  // Initialize the scene
  const container = document.getElementById("falling-stars-container");
  const canvas = document.getElementById("asteroids-canvas");
  const scoreElement = document.getElementById("score");

  // Scene setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    60,
    container.clientWidth / container.clientHeight,
    0.1,
    1000,
  );
  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true,
  });

  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  // Camera position
  camera.position.set(0, 0, 30);
  camera.lookAt(0, 0, 0);

  // Stars background
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 1000;
  const starPositions = [];

  for (let i = 0; i < starCount; i++) {
    // Random positions across the entire view
    const x = (Math.random() - 0.5) * 200;
    const y = (Math.random() - 0.5) * 200;
    const z = (Math.random() - 0.5) * 200;

    starPositions.push(x, y, z);
  }

  starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3),
  );

  const starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.5,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
  });

  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // Ship
  const shipGeometry = new THREE.BufferGeometry();
  const shipVertices = new Float32Array([
    0,
    2,
    0, // tip
    -1,
    -1,
    0, // bottom left
    1,
    -1,
    0, // bottom right
  ]);
  shipGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(shipVertices, 3),
  );

  const shipMaterial = new THREE.MeshBasicMaterial({
    color: 0x00ff00,
    wireframe: true,
  });

  const ship = new THREE.Mesh(shipGeometry, shipMaterial);
  scene.add(ship);

  // Ship controls
  let shipRotation = 0;
  let shipVelocity = new THREE.Vector2(0, 0);
  let thrustPower = 0;
  let score = 0;

  // Asteroids
  const asteroids = [];

  function createAsteroid(size = 3, position = null) {
    // Create an irregular asteroid shape
    const geometry = new THREE.IcosahedronGeometry(size, 0);

    // Make it more irregular
    const positions = geometry.attributes.position;
    const vertex = new THREE.Vector3();

    for (let i = 0; i < positions.count; i++) {
      vertex.fromBufferAttribute(positions, i);
      vertex.normalize().multiplyScalar(size * (0.8 + Math.random() * 0.3));
      positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
    }

    geometry.computeVertexNormals();

    const material = new THREE.MeshBasicMaterial({
      color: 0xaaaaaa,
      wireframe: true,
    });

    const asteroid = new THREE.Mesh(geometry, material);

    // Set random position if not provided
    if (!position) {
      // Start from outside the visible area
      const angle = Math.random() * Math.PI * 2;
      const distance = 40 + Math.random() * 10;
      position = new THREE.Vector3(
        Math.cos(angle) * distance,
        Math.sin(angle) * distance,
        0,
      );
    }

    asteroid.position.copy(position);

    // Random rotation
    asteroid.rotation.x = Math.random() * Math.PI;
    asteroid.rotation.y = Math.random() * Math.PI;
    asteroid.rotation.z = Math.random() * Math.PI;

    // Random velocity
    const velocity = new THREE.Vector3(
      (Math.random() - 0.5) * 0.2,
      (Math.random() - 0.5) * 0.2,
      0,
    );

    // Random rotation speed
    const rotationSpeed = new THREE.Vector3(
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02,
      (Math.random() - 0.5) * 0.02,
    );

    scene.add(asteroid);

    return {
      mesh: asteroid,
      velocity: velocity,
      rotationSpeed: rotationSpeed,
      size: size,
      radius: size, // for collision detection
    };
  }

  // Create bullets
  const bullets = [];
  const bulletGeometry = new THREE.SphereGeometry(0.2, 8, 8);
  const bulletMaterial = new THREE.MeshBasicMaterial({
    color: 0xff0000,
  });

  function fireBullet() {
    const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);

    // Position at ship's tip
    bullet.position.copy(ship.position);

    // Direction based on ship rotation
    const velocity = new THREE.Vector3(
      Math.sin(shipRotation),
      Math.cos(shipRotation),
      0,
    )
      .normalize()
      .multiplyScalar(1);

    scene.add(bullet);

    bullets.push({
      mesh: bullet,
      velocity: velocity,
      lifespan: 60, // frames
    });
  }

  // Initial asteroids
  for (let i = 0; i < 6; i++) {
    asteroids.push(createAsteroid());
  }

  // Keyboard controls
  const keys = {};

  window.addEventListener("keydown", (e) => {
    keys[e.key] = true;

    // Space to fire
    if (e.key === " " || e.code === "Space") {
      fireBullet();
      e.preventDefault();
    }
  });

  window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
  });

  // Mobile controls
  let touchStartPos = null;

  container.addEventListener("touchstart", (e) => {
    e.preventDefault();
    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });

  container.addEventListener("touchmove", (e) => {
    if (!touchStartPos) return;
    e.preventDefault();

    const dx = e.touches[0].clientX - touchStartPos.x;
    const dy = e.touches[0].clientY - touchStartPos.y;

    // Rotate based on horizontal movement
    shipRotation -= dx * 0.01;

    // Thrust based on vertical movement
    thrustPower = Math.max(0, -dy * 0.001);

    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  });

  container.addEventListener("touchend", () => {
    touchStartPos = null;
    thrustPower = 0;
  });

  // Double tap to fire on mobile
  let lastTap = 0;
  container.addEventListener("touchend", (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      fireBullet();
      e.preventDefault();
    }
    lastTap = currentTime;
  });

  // Handle window resize
  window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  // Check collisions
  function checkCollisions() {
    // Check bullets hitting asteroids
    for (let i = bullets.length - 1; i >= 0; i--) {
      const bullet = bullets[i];

      for (let j = asteroids.length - 1; j >= 0; j--) {
        const asteroid = asteroids[j];

        if (
          bullet.mesh.position.distanceTo(asteroid.mesh.position) <
          asteroid.radius
        ) {
          // Hit!
          scene.remove(bullet.mesh);
          bullets.splice(i, 1);

          scene.remove(asteroid.mesh);
          asteroids.splice(j, 1);

          // Increase score
          score += Math.floor(asteroid.size * 100);
          scoreElement.textContent = `SCORE: ${score}`;

          // Split asteroid if it's large enough
          if (asteroid.size > 1) {
            for (let k = 0; k < 2; k++) {
              asteroids.push(
                createAsteroid(
                  asteroid.size / 2,
                  asteroid.mesh.position.clone(),
                ),
              );
            }
          }

          break;
        }
      }
    }

    // Check ship hitting asteroids
    for (let i = 0; i < asteroids.length; i++) {
      const asteroid = asteroids[i];
      if (ship.position.distanceTo(asteroid.mesh.position) < asteroid.radius) {
        // Game over - reset ship
        ship.position.set(0, 0, 0);
        shipVelocity.set(0, 0);
        score = Math.max(0, score - 500);
        scoreElement.textContent = `SCORE: ${score}`;
        break;
      }
    }
  }

  // Wrap position around screen edges
  function wrapPosition(obj) {
    const margin = 40;

    if (obj.position.x > margin) {
      obj.position.x = -margin;
    } else if (obj.position.x < -margin) {
      obj.position.x = margin;
    }

    if (obj.position.y > margin) {
      obj.position.y = -margin;
    } else if (obj.position.y < -margin) {
      obj.position.y = margin;
    }
  }

  // Spawn new asteroids occasionally
  function spawnAsteroid() {
    if (asteroids.length < 10 && Math.random() < 0.01) {
      asteroids.push(createAsteroid());
    }
  }

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);

    // Ship rotation
    if (keys["ArrowLeft"] || keys["a"]) {
      shipRotation += 0.05;
    }
    if (keys["ArrowRight"] || keys["d"]) {
      shipRotation -= 0.05;
    }

    // Thrust
    if (keys["ArrowUp"] || keys["w"]) {
      thrustPower = 0.05;
    } else if (!touchStartPos) {
      thrustPower = 0;
    }

    // Apply thrust
    if (thrustPower > 0) {
      shipVelocity.x += Math.sin(shipRotation) * thrustPower;
      shipVelocity.y += Math.cos(shipRotation) * thrustPower;
    }

    // Apply drag
    shipVelocity.multiplyScalar(0.98);

    // Update ship position
    ship.position.x += shipVelocity.x;
    ship.position.y += shipVelocity.y;

    // Update ship rotation
    ship.rotation.z = -shipRotation + Math.PI;

    // Wrap position
    wrapPosition(ship);

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const bullet = bullets[i];
      bullet.mesh.position.add(bullet.velocity);

      // Handle wrapping
      wrapPosition(bullet.mesh);

      // Remove old bullets
      bullet.lifespan--;
      if (bullet.lifespan <= 0) {
        scene.remove(bullet.mesh);
        bullets.splice(i, 1);
      }
    }

    // Update asteroids
    for (let i = 0; i < asteroids.length; i++) {
      const asteroid = asteroids[i];

      // Move asteroid
      asteroid.mesh.position.add(asteroid.velocity);

      // Rotate asteroid
      asteroid.mesh.rotation.x += asteroid.rotationSpeed.x;
      asteroid.mesh.rotation.y += asteroid.rotationSpeed.y;
      asteroid.mesh.rotation.z += asteroid.rotationSpeed.z;

      // Wrap position
      wrapPosition(asteroid.mesh);
    }

    // Check collisions
    checkCollisions();

    // Spawn new asteroids
    spawnAsteroid();

    // Update star rotation (subtle background movement)
    stars.rotation.y += 0.0001;
    stars.rotation.x += 0.0001;

    renderer.render(scene, camera);
  }

  // Initialize
  animate();
</script>
