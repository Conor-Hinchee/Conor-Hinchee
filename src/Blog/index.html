<!doctype html>
<html lang="en">

<head>
  <title>Conor Hinchee | Blog</title>
  <module href="/components/head.html"></module>
  <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
</head>

<body>
  <module href="/components/banner.html"></module>
  <main class="bg-gray-50 dark:bg-gray-900 bgGridWhite">
    <div id="app" class="w-5/6 m-auto transition-all origin-top">
      <module href="/components/breadcrumb-nav.html"></module>
      <noscript>
        Read posts on github: github.com/Conor-Hinchee
      </noscript>
      <div class="mt-24" id="blog-post"></div>
    </div>
    <module href="/components/consent.html"></module>
  </main>
  <footer class="bg-gray-50 dark:bg-gray-900 bgGridWhite pt-16 pb-16 font-mono dark:text-white">
    <module href="/components/footer.html"></module>
  </footer>
  <script>
    const initMarkdown = async () => {
      const theme = localStorage.getItem("theme");
      const blogPostContainer = document.getElementById("blog-post");
      
      try {
        // Fetch all posts data from JSON file
        const response = await fetch('/blog/content/posts.json');
        if (!response.ok) {
          throw new Error('Failed to fetch posts data');
        }
        
        const data = await response.json();
        const posts = data.posts || [];
        
        // Get post ID from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        let postId = urlParams.get('post') || 'latest';
        
        // If postId is 'latest', use the most recent post
        if (postId === 'latest') {
          // Sort posts by date (newest first)
          posts.sort((a, b) => new Date(b.date) - new Date(a.date));
          postId = posts[0]?.id || '2025-resolution';
        }
        
        // Find the requested post
        const post = posts.find(p => p.id === postId) || posts[0];
        
        // Update page title based on post
        if (post && post.title) {
          document.title = `Conor Hinchee | Blog | ${post.title}`;
        }
        
        // Render the markdown file
        if (blogPostContainer) {
          blogPostContainer.innerHTML = `
            <zero-md src="/blog/content/${post.id}.md">
              <template>
                <link id="markdown-theme" rel="stylesheet" href="/blog/github-markdown-${theme}.css" />
              </template>
            </zero-md>
          `;
        }
      } catch (error) {
        console.error('Error loading blog post:', error);
        
        // Fallback to default post if there's an error
        if (blogPostContainer) {
          blogPostContainer.innerHTML = `
            <zero-md src="/blog/content/2025-resolution.md">
              <template>
                <link id="markdown-theme" rel="stylesheet" href="/blog/github-markdown-${theme}.css" />
              </template>
            </zero-md>
          `;
        }
      }
    };
    
    // Initialize the blog
    initMarkdown();
  </script>
  
</body>

</html>
